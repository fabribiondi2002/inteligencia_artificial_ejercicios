[project]
name = "inteligencia-artificial"
version = "0.1.0"
description = "Material de la asignatura Inteligencia Artificial"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.22.0",
    "pandas>=2.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "sqlalchemy>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "category-encoders>=2.6.0",
    "scipy>=1.11.0",
    "pyarrow>=14.0.0",
    "missingno>=0.5.2",
    "statsmodels>=0.14.0",
    "imbalanced-learn>=0.12.0",
    "ydata-profiling>=4.12.0",
    "sweetviz>=2.3.0",
    "nltk>=3.9.0",
    "wordcloud>=1.9.0",
    "librosa>=0.10.0",
    "tensorflow>=2.16.0",
    "setuptools>=68.0.0,<81",
    "pygame>=2.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = []
