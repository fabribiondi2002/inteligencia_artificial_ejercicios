[project]
name = "inteligencia-artificial"
version = "0.1.0"
description = "Material de la asignatura Inteligencia Artificial"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.22.0",
    "pandas>=2.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "sqlalchemy>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "category-encoders>=2.6.0",
    "scipy>=1.11.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = []
